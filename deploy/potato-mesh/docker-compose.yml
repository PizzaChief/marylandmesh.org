services:
  web:
    image: ghcr.io/l5yth/potato-mesh-web-${POTATOMESH_IMAGE_ARCH:-linux-amd64}:${POTATOMESH_IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    command: ["ruby", "app.rb", "-p", "41447", "-o", "0.0.0.0"]
    environment:
      APP_ENV: production
      RACK_ENV: production
      SITE_NAME: "${SITE_NAME:-Maryland Mesh Monitor}"
      INSTANCE_DOMAIN: ${INSTANCE_DOMAIN:?Set INSTANCE_DOMAIN in .env}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      MESHTASTIC_PRESET: "${MESHTASTIC_PRESET:-#LongFast}"
      MESHTASTIC_FREQ: "${MESHTASTIC_FREQ:-906.875MHz}"
      MAP_CENTER: "${MAP_CENTER:-39.0,-76.7}"
      MAP_ZOOM: "${MAP_ZOOM:-8}"
      CONTACT_LINK: "${CONTACT_LINK:-https://marylandmesh.org/}"
      FEDERATION: "${FEDERATION:-0}"
      TX_ENABLED: "0"
      TX_ANNOUNCE: "0"
    ports:
      - "127.0.0.1:41447:41447"
    volumes:
      - potatomesh_data:/app/.local/share/potato-mesh
      - potatomesh_config:/app/.config/potato-mesh
      - potatomesh_logs:/app/logs
      - potatomesh_pages:/app/pages

  # Optional collector for a Meshtastic node reachable over TCP.
  # Start with: docker compose --profile ingestor up -d
  ingestor:
    image: ghcr.io/l5yth/potato-mesh-ingestor-${POTATOMESH_IMAGE_ARCH:-linux-amd64}:${POTATOMESH_IMAGE_TAG:-v1.0.0}
    restart: unless-stopped
    profiles: ["ingestor"]
    depends_on:
      - web
    environment:
      PROTOCOL: meshtastic
      TRANSPORT: api
      CONNECTION: "${CONNECTION:?Set CONNECTION to a reachable node TCP address}"
      CHANNEL_INDEX: ${CHANNEL_INDEX:-0}
      INSTANCE_DOMAIN: http://web:41447
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      TX_ENABLED: "0"
      TX_ANNOUNCE: "0"

volumes:
  potatomesh_data:
  potatomesh_config:
  potatomesh_logs:
  potatomesh_pages:
